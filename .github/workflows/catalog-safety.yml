name: Catalog safety checks

on:
  push:
    branches:
      - catalog-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    name: Validate pre-launch catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < functions/api/products.js
          node --input-type=module --check < functions/api/catalog.js
          node --input-type=module --check < functions/api/health.js
          node --input-type=module --check < scripts/validate-catalog.mjs
      - name: Run local catalog safety checks
        run: node scripts/validate-catalog.mjs
